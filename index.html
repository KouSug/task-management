<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><rect width='256' height='256' fill='none'/><polyline points='172 104 113.33 160 84 132' fill='none' stroke='%236366f1' stroke-linecap='round' stroke-linejoin='round' stroke-width='24'/><rect x='40' y='40' width='176' height='176' rx='8' fill='none' stroke='%236366f1' stroke-linecap='round' stroke-linejoin='round' stroke-width='24'/></svg>" type="image/svg+xml">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Flatpickr (Calendar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ja.js"></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo">
          <i class="ph ph-check-square"></i>
          <h1>Task Manager</h1>
        </div>
        
        <div class="view-switcher" id="view-switcher">
          <button class="btn-view active" data-view="kanban" title="カンバン表示">
            <i class="ph ph-kanban"></i>
          </button>
          <button class="btn-view" data-view="table" title="リスト表示">
            <i class="ph ph-list-dashes"></i>
          </button>
          <button class="btn-view" data-view="calendar" title="カレンダー表示">
            <i class="ph ph-calendar"></i>
          </button>
        </div>

        <div class="auth-section">
          <button id="btn-login" class="btn btn-primary" style="display: none;">
            <i class="ph ph-google-logo"></i> Googleでログイン
          </button>
          <div id="user-info" class="user-info" style="display: none;">
            <img id="user-avatar" src="" alt="User" style="width: 32px; height: 32px; border-radius: 50%; display: none; object-fit: cover;">
            <span id="user-name"></span>
            <button id="btn-logout" class="btn btn-icon" title="ログアウト">
              <i class="ph ph-sign-out"></i>
            </button>
          </div>
        </div>
      </header>
      
      <div class="toolbar" id="toolbar" style="display: none;">
        <div class="toolbar-main">
          <div class="search-input-wrapper">
            <i class="ph ph-magnifying-glass"></i>
            <input type="text" id="filter-text" placeholder="タスク名やクライアントで検索...">
          </div>
          <div class="status-filter-wrapper">
            <select id="filter-status">
              <option value="all">すべてのステータス</option>
              <option value="todo">未着手</option>
              <option value="rough">初稿作成中</option>
              <option value="review">確認待ち</option>
              <option value="revision">修正対応中</option>
              <option value="done">納品完了</option>
            </select>
          </div>
          <button class="btn btn-secondary" id="btn-toggle-advanced-filter" title="詳細フィルター">
            <i class="ph ph-faders"></i> 詳細
          </button>
          <div style="flex: 1;"></div>
          <button class="btn btn-secondary" id="btn-export-csv" title="CSVエクスポート">
            <i class="ph ph-download-simple"></i> CSV出力
          </button>
        </div>
        
        <div class="advanced-filters" id="advanced-filters" style="display: none;">
          <div class="filter-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="filter-hide-done">
              <span class="checkbox-text">納品完了を非表示</span>
            </label>
          </div>
          <div class="filter-group">
            <label>納期</label>
            <div class="date-range-inputs">
              <input type="text" id="filter-deadline-from" placeholder="いつから">
              <span>〜</span>
              <input type="text" id="filter-deadline-to" placeholder="いつまで">
            </div>
          </div>
          <div class="filter-group">
            <label>クライアント</label>
            <select id="filter-client">
              <option value="all">すべて</option>
            </select>
          </div>
        </div>
      </div>
      
      <main class="board-container" id="board-container">
        <!-- Columns will be injected here by JS -->
      </main>

      <main class="table-container" id="table-container" style="display: none;">
        <table class="task-table">
          <thead>
            <tr>
              <th style="width: 15%" class="sortable" data-sort="status">ステータス <i class="ph ph-caret-down sort-icon"></i></th>
              <th style="width: 35%" class="sortable" data-sort="title">案件名 / タイトル <i class="ph ph-caret-down sort-icon"></i></th>
              <th style="width: 20%" class="sortable" data-sort="client">クライアント <i class="ph ph-caret-down sort-icon"></i></th>
              <th style="width: 12%" class="sortable" data-sort="deadline">納期 <i class="ph ph-caret-down sort-icon"></i></th>
              <th style="width: 12%" class="sortable" data-sort="deliveredAt">納品完了日 <i class="ph ph-caret-down sort-icon"></i></th>
              <th style="width: 15%">リンク・備考</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Rows will be injected here by JS -->
          </tbody>
        </table>
      </main>

      <!-- Calendar View -->
      <main class="calendar-container" id="calendar-container" style="display: none;">
        <div class="calendar-header">
          <button class="btn btn-icon" id="btn-prev-month" title="前月"><i class="ph ph-caret-left"></i></button>
          <h2 id="calendar-month-year">2026年 6月</h2>
          <button class="btn btn-icon" id="btn-next-month" title="次月"><i class="ph ph-caret-right"></i></button>
        </div>
        <div class="calendar-legend" id="calendar-legend">
          <!-- Legend items will be injected here -->
        </div>
        <div class="calendar-grid-header">
          <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
        </div>
        <div class="calendar-grid" id="calendar-grid">
          <!-- Calendar cells will be injected here -->
        </div>
      </main>

      <button id="btn-add-task" class="fab" title="タスクを追加">
        <i class="ph ph-plus"></i>
      </button>

      <!-- Task Modal -->
      <div id="task-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
          <div class="modal-header">
            <h2 id="modal-title">タスクを追加</h2>
            <button type="button" class="btn-close" id="btn-close-modal"><i class="ph ph-x"></i></button>
          </div>
          <form id="task-form">
            <input type="hidden" id="task-id">
            <div class="form-group">
              <label for="task-title">案件名 / タイトル *</label>
              <input type="text" id="task-title" required placeholder="例: 企業VP 〇〇様向け">
            </div>
            <div class="form-group">
              <label for="task-client">クライアント</label>
              <input type="text" id="task-client" placeholder="例: 株式会社〇〇">
            </div>
            <div class="form-group-row">
              <div class="form-group">
                <label for="task-deadline">納期</label>
                <input type="text" id="task-deadline" placeholder="日付を選択">
              </div>
              <div class="form-group">
                <label for="task-delivered-at">納品完了日</label>
                <input type="text" id="task-delivered-at" placeholder="未設定">
              </div>
              <div class="form-group">
                <label for="task-status">ステータス</label>
                <select id="task-status">
                  <option value="todo">未着手</option>
                  <option value="rough">初稿作成中</option>
                  <option value="review">確認待ち</option>
                  <option value="revision">修正対応中</option>
                  <option value="done">納品完了</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label for="task-link">素材・参照リンク</label>
              <input type="url" id="task-link" placeholder="https://drive.google.com/...">
            </div>
            <div class="form-group">
              <label for="task-notes">備考</label>
              <textarea id="task-notes" rows="3" placeholder="テロップの指定や要望など"></textarea>
            </div>
            <div class="modal-footer">
              <button type="button" id="btn-delete-task" class="btn btn-danger" style="display: none;">削除</button>
              <div class="spacer"></div>
              <button type="button" id="btn-cancel" class="btn btn-secondary">キャンセル</button>
              <button type="submit" class="btn btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
